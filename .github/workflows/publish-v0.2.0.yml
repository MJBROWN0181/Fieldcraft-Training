name: Publish Fieldcraft Training v0.2.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Publish Fieldcraft Training v0.2.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.2.0 --title "Fieldcraft Training v0.2.0" --notes-file RELEASE_NOTES_v0.2.0.md --target "$GITHUB_SHA"
